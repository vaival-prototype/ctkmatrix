name: Deploy CTK Claim Matrix to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_mock:
        description: "Serve bundled mock data instead of the live API"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Manual run -> use the checkbox. Push -> repo variable VITE_USE_MOCK (defaults to "true").
      VITE_USE_MOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.use_mock && 'true' || github.event_name == 'workflow_dispatch' && 'false' || vars.VITE_USE_MOCK || 'true' }}
      # Must be HTTPS in production, otherwise browsers block it (mixed content) on github.io.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://216.24.136.56:9050/api' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 needs Node 20.19+ / 22.12+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          echo "Mock mode: $VITE_USE_MOCK | API: $VITE_API_BASE_URL"
          npm run build

      - name: SPA fallback (deep links + refresh)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
