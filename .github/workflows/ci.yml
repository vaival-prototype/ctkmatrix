name: Deploy CTK Claim Matrix to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_mock:
        description: "Serve bundled mock data instead of the live API"
        type: boolean
        default: true

permissions:
  contents: write # needed to push the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_USE_MOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.use_mock && 'true' || github.event_name == 'workflow_dispatch' && 'false' || vars.VITE_USE_MOCK || 'true' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://216.24.136.56:9050/api' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Sanity check (fail if raw source slipped in)
        run: |
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "::error::dist/index.html still references src/main.jsx"; exit 1
          fi
          grep -o 'src="[^"]*assets/[^"]*"' dist/index.html

      - name: Publish dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
